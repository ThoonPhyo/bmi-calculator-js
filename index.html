<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="./images/bmi.png" type="image/x-icon" />

    <!-- bootstrap cdn link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- style css -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Dark/Light Mode Toggle — place this before your card div -->
    <div class="mode-toggle" onclick="toggleMode()">
      <span class="mode-icon">🌙</span>
    </div>

    <div class="position-relative bg-light" style="height: 100vh !important">
      <div class="position-absolute top-50 start-50 translate-middle">
        <div
          class="card text-center mb-3 rounded-3"
          id="card"
          style="width: 22rem; height: 400px"
        >
          <div class="card-header">
            <h5 class="card-title">BMI Calculator</h5>
          </div>
          <div class="card-body p-3">
            <!-- units -->
            <div
              class="btn-group"
              role="group"
              aria-label="Basic radio toggle button group"
            >
              <input
                type="radio"
                class="btn-check"
                name="btnunits"
                id="btnstandard"
                autocomplete="off"
                checked
                onclick="standardFunction()"
              />
              <label class="btn btn-outline-primary" for="btnstandard"
                >Standard</label
              >

              <input
                type="radio"
                class="btn-check"
                name="btnunits"
                id="btnmetric"
                autocomplete="off"
                onclick="metricFunction()"
              />
              <label class="btn btn-outline-primary" for="btnmetric"
                >Metric</label
              >
            </div>

            <!-- standard container -->
            <div class="container text-start mt-3" id="standardContainer">
              <!-- weight -->
              <div class="row mb-3">
                <label for="weight" class="form-label">Weight (pounds)</label>
                <div class="col-10">
                  <input
                    type="number"
                    class="form-control"
                    id="weightStandard"
                    placeholder="Enter your weight in pounds"
                  />
                </div>
                <div class="col-auto align-self-center">
                  <span> lb </span>
                </div>
              </div>

              <!-- height -->
              <div class="row mb-3">
                <label for="height" class="form-label"
                  >Height (feet & inches)</label
                >
                <div class="row">
                  <!-- feet -->
                  <div class="col-6 text-start">
                    <div class="row gap-0">
                      <div class="col-9">
                        <input
                          type="number"
                          class="form-control"
                          id="heightStandardFeet"
                          placeholder="Feet"
                        />
                      </div>
                      <div class="col-auto align-self-center">
                        <span> ft </span>
                      </div>
                    </div>
                  </div>

                  <!-- inches -->
                  <div class="col-6 text-end">
                    <div class="row gap-0">
                      <div class="col-9">
                        <input
                          type="number"
                          class="form-control"
                          id="heightStandardInches"
                          placeholder="Inches"
                        />
                      </div>
                      <div class="col-auto align-self-center">
                        <span> in </span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- metric container -->
            <div
              class="container text-start mt-3"
              id="metricContainer"
              style="display: none"
            >
              <!-- weight -->
              <div class="row mb-3">
                <label for="weight" class="form-label"
                  >Weight (kilograms)</label
                >
                <div class="col-10">
                  <input
                    type="number"
                    class="form-control"
                    id="weightMetric"
                    placeholder="Enter your weight in kilograms"
                  />
                </div>
                <div class="col-auto align-self-center">
                  <span> kg </span>
                </div>
              </div>

              <!-- height -->
              <div class="row mb-3">
                <label for="height" class="form-label"
                  >Height (centimeters)</label
                >
                <div class="col-10">
                  <input
                    type="number"
                    class="form-control"
                    id="heightMetric"
                    placeholder="Enter your height in centimeters"
                  />
                </div>
                <div class="col-auto align-self-center">
                  <span> cm </span>
                </div>
              </div>
            </div>

            <!-- calculate button -->
            <div class="d-grid px-2">
              <button
                class="btn btn-primary"
                id="calculateBtn"
                type="button"
                onclick="calculateBMI()"
              >
                Calculate BMI
              </button>
            </div>

            <!-- Results -->
            <div class="result text-center mt-3">
              <h2>Your BMI : <span id="bmiValue">0</span></h2>
              <p id="bmiCategory"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- js -->
    <script src="script.js"></script>
  </body>
</html>
